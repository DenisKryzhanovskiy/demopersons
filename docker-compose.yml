services:
  teachers-service:
    image: 	insanedenchik/rsue-teachers-service
    container_name: teachers-app
    ports:
      - "8085:8085"
    networks:
      backend:
        aliases:
          - "teachers-service"

  disciplines-service:
    image: 	insanedenchik/rsue-disciplines-service
    container_name: disciplines-app
    ports:
      - "8086:8086"
    networks:
      backend:
        aliases:
          - "disciplines-service"

networks:
  backend:
    driver: bridge